# Fly.io config for the backend. `fly launch --no-deploy` picks this up.
# Rename `app` to something unique before deploying.
app = "honest-backtester-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Lock this to your real frontend origin before going public — a wildcard
  # would let any site call this API from a visitor's browser.
  # MUST be a JSON array, not a bare string: cors_origins is list[str], and
  # pydantic-settings raises SettingsError on boot for anything else.
  HONEST_CORS_ORIGINS = '["https://REPLACE-ME.vercel.app"]'
  HONEST_LLM_MODEL = "gpt-5-nano"

# Secrets are NOT set here. Use:  fly secrets set OPENAI_API_KEY=...
# (encrypted at rest; never committed.)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true      # scale to zero between visitors — cheap
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "honest_data"
  destination = "/data"

[[vm]]
  memory = "1gb"                 # pandas + a 500-ticker panel needs headroom
  cpu_kind = "shared"
  cpus = 1
